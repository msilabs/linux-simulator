name: CI

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Locale for the real-bash comparison
        run: sudo locale-gen en_US.UTF-8
      - run: npm test
      - run: node alo build
