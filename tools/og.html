<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@700;800&family=Noto+Sans+Bengali:wght@500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
    * { margin: 0; box-sizing: border-box; }
    html, body { width: 1200px; height: 630px; overflow: hidden; }
    body { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 0 100px; color: #14213D;
        background: radial-gradient(circle at 0% 0%, #dbe8ee 0%, transparent 55%), radial-gradient(circle at 100% 100%, #dfeae4 0%, transparent 45%), #f6f8fa;
        font-family: 'Noto Sans Bengali', sans-serif; }
    .copy { flex: none; width: 490px; display: grid; gap: 20px; }
    .brand { display: flex; align-items: center; gap: 16px; }
    .brand img { width: 56px; height: 56px; border-radius: 14px; }
    .brand strong { display: block; font: 800 28px 'Baloo Da 2', sans-serif; line-height: 1.1; }
    .brand span { display: block; margin-top: 2px; font-size: 18px; font-weight: 500; color: #5b6782; }
    h1 { font-family: 'Baloo Da 2', 'Noto Sans Bengali', sans-serif; font-size: 74px; line-height: 1.08; white-space: nowrap; font-weight: 800; letter-spacing: -.02em; }
    h1 span { display: block; background: linear-gradient(100deg, #1f7a9a, #1f9a68); -webkit-background-clip: text; background-clip: text; color: transparent; }
    p { font-size: 25px; line-height: 1.55; font-weight: 500; color: #5b6782; }
    .pills { display: flex; flex-wrap: wrap; gap: 12px; }
    .pills b { padding: 8px 20px; border-radius: 999px; background: #dbe8ee; color: #1f6f8e; font-size: 19px; font-weight: 700; }
    .window { flex: none; width: 510px; border-radius: 24px; background: #fff; border: 1px solid #dfe5ec; box-shadow: 0 30px 70px -30px rgba(20,33,61,.35); overflow: hidden; }
    .bar { display: flex; align-items: center; gap: 9px; padding: 18px 24px; background: #eef2f6; border-bottom: 1px solid #dfe5ec; font-size: 18px; font-weight: 700; color: #5b6782; }
    .bar i { width: 13px; height: 13px; border-radius: 50%; background: #ff6159; }
    .bar i:nth-child(2) { background: #ffbd2e; } .bar i:nth-child(3) { background: #28c940; margin-right: 10px; }
    .body { padding: 16px; }
    .term { padding: 20px 18px 22px; border-radius: 14px; background: #070D1C; font: 500 16px/1.8 'JetBrains Mono', monospace; color: #C8D2E6; white-space: pre; }
    .exp { display: flex; white-space: nowrap; align-items: baseline; gap: 8px; margin: 6px 0 12px; padding: 10px 10px; border-radius: 8px; background: rgba(124,156,255,.12); font: 500 14px/1.7 'Noto Sans Bengali', sans-serif; color: #C8D2E6; }
    .tag { flex: none; padding: 1px 10px; border-radius: 999px; background: rgba(124,156,255,.28); color: #9db4ff; font-size: 13px; font-weight: 700; }
    .exp code { padding: 1px 6px; border-radius: 5px; background: rgba(255,255,255,.09); color: #ffd58a; font: 500 14px 'JetBrains Mono', monospace; }
    .cur { display: inline-block; width: 2px; height: 1.1em; margin-left: 6px; vertical-align: text-bottom; background: #f0a417; }
    .p { color: #1ED6A8; font-weight: 700; } .d { color: #7c9cff; } .e { color: #ffd58a; }
    .note { padding: 14px 18px; border-radius: 12px; background: #eaf0ff; border-left: 4px solid #7c9cff; font-size: 19px; line-height: 1.6; font-weight: 500; }
    .note b { margin-right: 6px; padding: 1px 10px; border-radius: 999px; background: #cfdcff; color: #3a5ad0; font-size: 16px; }
</style>
</head>
<body>
    <div class="copy">
        <div class="brand">
            <img src="../public/favicon.svg" alt="">
            <div><strong>Linux Simulator</strong><span>by msilabs</span></div>
        </div>
        <h1>Linux Terminal, <span>এবার বাংলায়</span></h1>
        <p>ব্রাউজারেই চলে নিরাপদ practice terminal, প্রতিটা command-এর বাংলা ব্যাখ্যা</p>
    </div>
    <div class="window">
        <div class="bar"><i></i><i></i><i></i>Playground</div>
        <div class="body">
            <div class="term"><span class="p">dev@laptop:~$</span> ls
downloads  notes.txt  projects  scripts<div class="exp"><span class="tag">ব্যাখ্যা</span><span><code>ls</code> ফোল্ডারের ভেতরের ফাইল আর ফোল্ডারের নাম দেখায়।</span></div><span class="p">dev@laptop:~$</span><span class="cur"></span></div>
        </div>
    </div>
</body>
</html>
